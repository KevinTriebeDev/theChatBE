{% load static %}

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>
    <link rel="stylesheet" href="{% static 'chat_app/style.css' %}">
</head>
<body>
    <h1>Chat</h1>

    <form id="chat-form">
        {% csrf_token %}
        <input id="name" type="text" placeholder="Name" required>
        <input id="message" type="text" placeholder="Nachricht" required>
        <button type="submit">Senden</button>
    </form>

    <div id="chats"></div>

    <script src="{% static 'chat_app/script.js' %}"></script>
</body>
</html>
